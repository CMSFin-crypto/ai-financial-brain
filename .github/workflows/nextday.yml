name: nextday-predictions

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC, Mon-Fri (after US market close)
  workflow_dispatch: {}        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nextday/requirements.txt

      - run: pip install -r nextday/requirements.txt

      - name: Run model
        run: python nextday/nextday_service.py
        env:
          NEXTDAY_OUT: public/nextday.json

      - name: Commit result
        run: |
          git config user.name "nextday-bot"
          git config user.email "nextday-bot@users.noreply.github.com"
          git add public/nextday.json
          git diff --cached --quiet || git commit -m "nextday: update predictions"
          git push
